name: Release Tag

# Computes the next SemVer tag from Conventional Commits on every push to
# main and pushes it, per CLAUDE.md: fix -> PATCH, feat -> MINOR,
# fix!/feat!/BREAKING CHANGE -> MAJOR. Any other commit type alone does not
# trigger a release. Tag creation triggers .github/workflows/release.yml
# (GoReleaser) via its own `push: tags` trigger.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and push next tag
        run: |
          set -euo pipefail

          last_tag="$(git tag -l 'v*' --sort=-v:refname | head -1 || true)"
          if [ -z "$last_tag" ]; then
            base="v0.0.0"
            range="HEAD"
          else
            base="$last_tag"
            range="${last_tag}..HEAD"
          fi
          echo "Last tag: ${base}"

          major="$(echo "${base#v}" | cut -d. -f1)"
          minor="$(echo "${base#v}" | cut -d. -f2)"
          patch="$(echo "${base#v}" | cut -d. -f3)"

          bump="none"
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if echo "$subject" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' ; then
              bump="major"; break
            fi
            if echo "$subject" | grep -qE '^feat(\([^)]*\))?:'; then
              [ "$bump" != "major" ] && bump="minor"
            elif echo "$subject" | grep -qE '^fix(\([^)]*\))?:'; then
              [ "$bump" = "none" ] && bump="patch"
            fi
          done < <(git log --no-merges --format='%s' "$range")

          # A footer-based "BREAKING CHANGE:" also forces major, even on a
          # commit type that wasn't caught by the subject-line "!" check.
          if git log --no-merges --format='%B' "$range" | grep -q 'BREAKING CHANGE:'; then
            bump="major"
          fi

          echo "Bump: ${bump}"

          case "$bump" in
            major)
              major=$((major + 1)); minor=0; patch=0
              ;;
            minor)
              minor=$((minor + 1)); patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            none)
              echo "No fix/feat/breaking commits since ${base}; skipping release."
              exit 0
              ;;
          esac

          new_tag="v${major}.${minor}.${patch}"
          echo "New tag: ${new_tag}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${new_tag}" -m "${new_tag}"
          git push origin "${new_tag}"
